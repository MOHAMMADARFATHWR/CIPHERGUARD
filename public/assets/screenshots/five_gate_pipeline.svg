<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="gateGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gateRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gateCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35D6C5"/>
      <stop offset="100%" stop-color="#4C8DFF"/>
    </linearGradient>
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4"/>
    </pattern>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#pBg)"/>
  <rect width="1280" height="720" fill="url(#dotPattern)"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1280" height="54" fill="#0b1120" stroke="#1e293b"/>
  <circle cx="28" cy="27" r="14" fill="url(#gateCyan)"/>
  <text x="50" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">CIPHERGUARD 3D</text>
  <rect x="180" y="16" width="150" height="22" rx="4" fill="#35D6C5" fill-opacity="0.12" stroke="#35D6C5" stroke-opacity="0.3"/>
  <text x="188" y="31" fill="#35D6C5" font-family="monospace" font-size="10" font-weight="600">5-GATE ZERO-TRUST ENGINE</text>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 80)">
    <rect width="1160" height="74" rx="12" fill="#111827" stroke="#1e293b"/>
    <text x="24" y="34" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20">Cryptographic Defense Pipeline Inspector</text>
    <text x="24" y="56" fill="#94a3b8" font-family="sans-serif" font-size="12">Mechanical Multi-Stage Gate Verification Pipeline (RFC 8446, NIST SP 800-38D, FIPS 186-4, RFC 5246, ISO 20022)</text>
    <rect x="990" y="24" width="146" height="28" rx="6" fill="#059669" fill-opacity="0.2" stroke="#10b981"/>
    <text x="1006" y="42" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">✔ 5/5 GATES ARMED</text>
  </g>

  <!-- Five Connected Gates in Horizontal Pipeline -->
  <!-- Gate Connecting Line -->
  <line x1="160" y1="280" x2="1120" y2="280" stroke="#334155" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="160" y1="280" x2="900" y2="280" stroke="#10b981" stroke-width="4"/>

  <!-- Gate 1: TLS 1.3 Handshake -->
  <g transform="translate(70, 180)">
    <rect width="210" height="200" rx="12" fill="url(#gateGreen)" stroke="#10b981" stroke-width="2"/>
    <circle cx="105" cy="40" r="22" fill="#065f46" stroke="#34d399"/>
    <text x="98" y="46" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">G1</text>
    <text x="105" y="86" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TLS 1.3 Handshake</text>
    <text x="105" y="104" fill="#6ee7b7" font-family="monospace" font-size="10" text-anchor="middle">RFC 8446 SECURE</text>
    <rect x="16" y="118" width="178" height="42" rx="6" fill="#022c22" stroke="#047857"/>
    <text x="24" y="134" fill="#a7f3d0" font-family="monospace" font-size="9">Cipher: TLS_AES_256_GCM</text>
    <text x="24" y="148" fill="#6ee7b7" font-family="monospace" font-size="9">Key: X25519 Ephemeral</text>
    <rect x="35" y="168" width="140" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="105" y="183" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✔ PASSED (1.8 ms)</text>
  </g>

  <!-- Gate 2: AES-256-GCM AEAD Tag -->
  <g transform="translate(305, 180)">
    <rect width="210" height="200" rx="12" fill="url(#gateGreen)" stroke="#10b981" stroke-width="2"/>
    <circle cx="105" cy="40" r="22" fill="#065f46" stroke="#34d399"/>
    <text x="98" y="46" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">G2</text>
    <text x="105" y="86" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AES-256-GCM AEAD</text>
    <text x="105" y="104" fill="#6ee7b7" font-family="monospace" font-size="10" text-anchor="middle">NIST SP 800-38D</text>
    <rect x="16" y="118" width="178" height="42" rx="6" fill="#022c22" stroke="#047857"/>
    <text x="24" y="134" fill="#a7f3d0" font-family="monospace" font-size="9">AEAD Tag: 128-bit Polyval</text>
    <text x="24" y="148" fill="#6ee7b7" font-family="monospace" font-size="9">Tamper Defense: Active</text>
    <rect x="35" y="168" width="140" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="105" y="183" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✔ PASSED (3.2 ms)</text>
  </g>

  <!-- Gate 3: ECDSA P-256 Signature -->
  <g transform="translate(540, 180)">
    <rect width="210" height="200" rx="12" fill="url(#gateGreen)" stroke="#10b981" stroke-width="2"/>
    <circle cx="105" cy="40" r="22" fill="#065f46" stroke="#34d399"/>
    <text x="98" y="46" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">G3</text>
    <text x="105" y="86" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ECDSA P-256 Sign</text>
    <text x="105" y="104" fill="#6ee7b7" font-family="monospace" font-size="10" text-anchor="middle">FIPS 186-4 NON-REPUDIATION</text>
    <rect x="16" y="118" width="178" height="42" rx="6" fill="#022c22" stroke="#047857"/>
    <text x="24" y="134" fill="#a7f3d0" font-family="monospace" font-size="9">Curve: secp256r1 (SHA-256)</text>
    <text x="24" y="148" fill="#6ee7b7" font-family="monospace" font-size="9">Sig: (r, s) Components Valid</text>
    <rect x="35" y="168" width="140" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="105" y="183" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✔ PASSED (5.1 ms)</text>
  </g>

  <!-- Gate 4: Nonce & Replay Cache -->
  <g transform="translate(775, 180)">
    <rect width="210" height="200" rx="12" fill="url(#gateGreen)" stroke="#10b981" stroke-width="2"/>
    <circle cx="105" cy="40" r="22" fill="#065f46" stroke="#34d399"/>
    <text x="98" y="46" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">G4</text>
    <text x="105" y="86" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Nonce &amp; Replay Cache</text>
    <text x="105" y="104" fill="#6ee7b7" font-family="monospace" font-size="10" text-anchor="middle">RFC 5246 REPLAY GUARD</text>
    <rect x="16" y="118" width="178" height="42" rx="6" fill="#022c22" stroke="#047857"/>
    <text x="24" y="134" fill="#a7f3d0" font-family="monospace" font-size="9">Nonce: 0x9f4a821e (New)</text>
    <text x="24" y="148" fill="#6ee7b7" font-family="monospace" font-size="9">Sliding Window: 300s TTL</text>
    <rect x="35" y="168" width="140" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="105" y="183" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✔ PASSED (0.9 ms)</text>
  </g>

  <!-- Gate 5: Double-Entry Ledger -->
  <g transform="translate(1010, 180)">
    <rect width="210" height="200" rx="12" fill="url(#gateGreen)" stroke="#10b981" stroke-width="2"/>
    <circle cx="105" cy="40" r="22" fill="#065f46" stroke="#34d399"/>
    <text x="98" y="46" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">G5</text>
    <text x="105" y="86" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Ledger Settlement</text>
    <text x="105" y="104" fill="#6ee7b7" font-family="monospace" font-size="10" text-anchor="middle">ISO 20022 DOUBLE ENTRY</text>
    <rect x="16" y="118" width="178" height="42" rx="6" fill="#022c22" stroke="#047857"/>
    <text x="24" y="134" fill="#a7f3d0" font-family="monospace" font-size="9">Debit: -₹25,000.00</text>
    <text x="24" y="148" fill="#6ee7b7" font-family="monospace" font-size="9">Credit: +₹25,000.00</text>
    <rect x="35" y="168" width="140" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="105" y="183" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✔ COMMITTED (4.4 ms)</text>
  </g>

  <!-- Lower Deep-Dive: Payload Cryptographic Digest & Mathematical Proofs -->
  <g transform="translate(70, 410)">
    <rect width="1150" height="270" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect width="1150" height="38" rx="12" fill="#1e293b" fill-opacity="0.6"/>
    <text x="24" y="24" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Active Transaction Cryptographic Payload Proof (TX-7F9A-4821)</text>

    <!-- Column 1: Canonical JSON Structure -->
    <g transform="translate(24, 54)">
      <text x="0" y="14" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">1. CANONICAL SENDER PAYLOAD (SHA-256 HASHED)</text>
      <rect y="24" width="350" height="170" rx="6" fill="#090d16" stroke="#1e293b"/>
      <text x="14" y="46" fill="#94a3b8" font-family="monospace" font-size="10">{</text>
      <text x="28" y="64" fill="#cbd5e1" font-family="monospace" font-size="10">"id": <tspan fill="#34d399">"TX-7F9A-4821"</tspan>,</text>
      <text x="28" y="82" fill="#cbd5e1" font-family="monospace" font-size="10">"amount": <tspan fill="#38bdf8">25000.00</tspan>,</text>
      <text x="28" y="100" fill="#cbd5e1" font-family="monospace" font-size="10">"currency": <tspan fill="#34d399">"INR"</tspan>,</text>
      <text x="28" y="118" fill="#cbd5e1" font-family="monospace" font-size="10">"sender": <tspan fill="#34d399">"ACC-PRIYA-9821"</tspan>,</text>
      <text x="28" y="136" fill="#cbd5e1" font-family="monospace" font-size="10">"recipient": <tspan fill="#34d399">"ACC-RAHUL-4401"</tspan>,</text>
      <text x="28" y="154" fill="#cbd5e1" font-family="monospace" font-size="10">"nonce": <tspan fill="#f59e0b">"0x9f4a821e"</tspan></text>
      <text x="14" y="172" fill="#94a3b8" font-family="monospace" font-size="10">}</text>
    </g>

    <!-- Column 2: AES-256-GCM Envelope & Tag -->
    <g transform="translate(400, 54)">
      <text x="0" y="14" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">2. AES-256-GCM ENVELOPE (AUTHENTICATED TAG)</text>
      <rect y="24" width="350" height="170" rx="6" fill="#090d16" stroke="#1e293b"/>
      <text x="14" y="48" fill="#64748b" font-family="monospace" font-size="10">// Ciphertext (Base64 Encoded)</text>
      <text x="14" y="68" fill="#e2e8f0" font-family="monospace" font-size="9" word-spacing="2">eW91X3dpbGxfbmV2ZXJfc2VlX3RoaXNf</text>
      <text x="14" y="84" fill="#e2e8f0" font-family="monospace" font-size="9">cGxhaW50ZXh0X2luX3RyYW5zaXQ=</text>
      <text x="14" y="112" fill="#64748b" font-family="monospace" font-size="10">// 128-bit Authentication Tag</text>
      <text x="14" y="130" fill="#34d399" font-family="monospace" font-size="10">TAG: 0xa8f27c3e109d43bf29c8e1</text>
      <text x="14" y="154" fill="#10b981" font-family="sans-serif" font-size="10">Status: AEAD MAC Tag matches perfectly.</text>
      <text x="14" y="170" fill="#6ee7b7" font-family="sans-serif" font-size="10">Zero bit tampering detected.</text>
    </g>

    <!-- Column 3: ECDSA Asymmetric Verification -->
    <g transform="translate(776, 54)">
      <text x="0" y="14" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold">3. ECDSA P-256 SIGNATURE VERIFICATION</text>
      <rect y="24" width="350" height="170" rx="6" fill="#090d16" stroke="#1e293b"/>
      <text x="14" y="48" fill="#64748b" font-family="monospace" font-size="10">// Public Key (secp256r1)</text>
      <text x="14" y="68" fill="#c084fc" font-family="monospace" font-size="9">MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...</text>
      <text x="14" y="98" fill="#64748b" font-family="monospace" font-size="10">// Digital Signature Coordinates (r, s)</text>
      <text x="14" y="118" fill="#e9d5ff" font-family="monospace" font-size="9">r: 0x48e1a9c372df009b7c84...</text>
      <text x="14" y="134" fill="#e9d5ff" font-family="monospace" font-size="9">s: 0x9320fec188d37aa2bc4e...</text>
      <text x="14" y="162" fill="#a855f7" font-family="sans-serif" font-size="10" font-weight="bold">Mathematical Proof: Non-repudiation VALID</text>
    </g>
  </g>
</svg>
