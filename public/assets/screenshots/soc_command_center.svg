    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.05"/>
